<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Shopping Cart</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body>

    <!-- Application Header -->

    <header>

        <div class="brand">

            <h1>ShopEasy</h1>

            <span>
                Simple Shopping
            </span>

        </div>


        <div class="header-actions">

            <div class="cart">

                🛒

                <span>
                    Cart
                </span>

                <span id="cartCount">
                    0
                </span>

            </div>


            <button
                id="themeButton"
                class="theme-button"
                aria-label="Toggle theme">

                🌙

            </button>

        </div>

    </header>


    <main>

        <!-- Products -->

        <section class="products">

            <div class="products-header">

                <div>

                    <h2>
                        Products
                    </h2>

                    <p>
                        Find what you need
                    </p>

                </div>


                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="🔍 Search products..."
                    aria-label="Search products">

            </div>


            <!-- Category Buttons -->

            <div class="category-buttons">

                <button
                    class="category-button active"
                    data-category="all">

                    All

                </button>


                <button
                    class="category-button"
                    data-category="clothing">

                    Clothing

                </button>


                <button
                    class="category-button"
                    data-category="shoes">

                    Shoes

                </button>


                <button
                    class="category-button"
                    data-category="electronics">

                    Electronics

                </button>


                <button
                    class="category-button"
                    data-category="accessories">

                    Accessories

                </button>

            </div>


            <div
                id="productList"
                class="product-list">

            </div>

        </section>


        <!-- Shopping Cart -->

        <section class="cart-section">

            <h2>
                Your Cart
            </h2>


            <div id="cartItems">

            </div>


            <!-- Cart Summary -->

            <div class="cart-summary">

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        ₹<span id="subtotalPrice">0</span>
                    </strong>

                </div>


                <!-- Coupon -->

                <div class="coupon-box">

                    <input
                        type="text"
                        id="couponInput"
                        placeholder="Enter coupon code"
                        aria-label="Coupon code">

                    <button
                        id="couponButton">

                        Apply

                    </button>

                </div>


                <div
                    id="couponMessage"
                    class="coupon-message">

                </div>


                <div class="summary-row discount-row">

                    <span>
                        Discount
                    </span>

                    <strong>
                        - ₹<span id="discountPrice">0</span>
                    </strong>

                </div>


                <!-- Total -->

                <div class="cart-total">

                    <span>
                        Total
                    </span>

                    <strong>
                        ₹<span id="totalPrice">0</span>
                    </strong>

                </div>


                <button
                    id="checkoutButton"
                    class="checkout-button"
                    disabled>

                    Proceed to Checkout

                </button>

            </div>

        </section>

    </main>


    <!-- Signature -->

        aria-hidden="true">

        </svg>

    </div>


    <!-- Checkout Modal -->

    <div
        id="checkoutModal"
        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Checkout
                </h2>

                <button
                    id="closeModal"
                    class="close-button"
                    aria-label="Close checkout">

                    ×

                </button>

            </div>


            <form id="checkoutForm">

                <label for="customerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your name"
                    required>


                <label for="customerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="customerEmail"
                    placeholder="Enter your email"
                    required>


                <label for="customerAddress">
                    Delivery Address
                </label>

                <textarea
                    id="customerAddress"
                    placeholder="Enter your address"
                    rows="3"
                    required></textarea>


                <label for="paymentMethod">
                    Payment Method
                </label>

                <select id="paymentMethod">

                    <option value="cod">
                        Cash on Delivery
                    </option>

                    <option value="upi">
                        UPI
                    </option>

                    <option value="card">
                        Credit / Debit Card
                    </option>

                </select>


                <div class="checkout-total">

                    Total:

                    ₹<span id="checkoutTotal">
                        0
                    </span>

                </div>


                <button
                    type="submit"
                    class="place-order-button">

                    Place Order

                </button>

            </form>

        </div>

    </div>


    <!-- Order Success -->

    <div
        id="successModal"
        class="modal">

        <div class="success-content">

            <div class="success-icon">
                ✓
            </div>


            <h2>
                Order Placed Successfully!
            </h2>


            <p>
                Thank you for shopping with ShopEasy.
            </p>


            <div class="order-details">

                <div>

                    <span>
                        Order ID
                    </span>

                    <strong id="orderId">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Total Amount
                    </span>

                    <strong>
                        ₹<span id="successTotal">
                            0
                        </span>
                    </strong>

                </div>

            </div>


            <button
                id="continueShopping"
                class="place-order-button">

                Continue Shopping

            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
